name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The eval cases (tests/evals/cases) apply their diffs on commits of this repo's history.
          fetch-depth: 0
      - name: shellcheck
        run: shellcheck --shell=sh --severity=warning install.sh hooks/*.sh scripts/*.sh skills/ship/*.sh tests/*.sh tests/evals/*.sh
      - name: shfmt
        # Where install.sh puts it, so the gate's tests find the parser (claude-ship #135).
        run: mkdir -p "$HOME/.claude/bin" && sh scripts/fetch-shfmt.sh "$HOME/.claude/bin/shfmt"
      - name: tests
        run: for t in tests/*.sh; do sh "$t" || exit 1; done
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
