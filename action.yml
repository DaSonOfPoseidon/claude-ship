name: Codex review status
description: Sets the `codex-review` commit status on a PR's head from Codex's reviews and review threads.
# The status script is this action's own copy, at the ref the caller names, so nothing in the calling repo
# decides it. The bot-only filter and concurrency live in the reusable workflow
# (.github/workflows/codex-status.yml), triggers and permissions in the caller (docs/scripts.md,
# skills/ship/templates/codex-review.yml).
inputs:
  pr:
    description: Pull request number
    required: true
  token:
    description: Token that can read the PR and write commit statuses
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: sh
      run: '"$GITHUB_ACTION_PATH/scripts/codex-status.sh" "$PR"'
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PR: ${{ inputs.pr }}
